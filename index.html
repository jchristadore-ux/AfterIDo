<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#FFFFFF" />

    <!--
      Defaults. These are the values every crawler that doesn't run JavaScript
      sees, so they have to stand on their own.

      On Cloudflare the Worker streams this HTML through HTMLRewriter and swaps
      in the right title, description and canonical URL for the route being
      requested (worker/seo.ts) — that's what makes a shared link to a state
      guide preview as that state guide rather than as the homepage. In the
      browser, React's <Seo> component does the same thing for Google.
      Both read shared/seo.ts, so they can't disagree.
    -->
    <title>Change your name everywhere. Without the headache. | AfterIDo</title>
    <meta
      name="description"
      content="One personalized checklist for everything you need to update after getting married — from Social Security and your driver&rsquo;s license to banks, insurance, work, travel and more."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AfterIDo" />
    <meta property="og:title" content="Change your name everywhere. Without the headache." />
    <meta
      property="og:description"
      content="One personalized checklist for everything you need to update after getting married — from Social Security and your driver&rsquo;s license to banks, insurance, work, travel and more."
    />
    <meta property="og:image" content="/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Change your name everywhere. Without the headache." />
    <meta
      name="twitter:description"
      content="One personalized checklist for everything you need to update after getting married."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- App icon: the rose-gold ring and diamond from the wordmark. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2714%27%20fill%3D%27%23FFFFFF%27%2F%3E%3Ccircle%20cx%3D%2732%27%20cy%3D%2738%27%20r%3D%2714%27%20fill%3D%27none%27%20stroke%3D%27%23D4A5A5%27%20stroke-width%3D%273.4%27%2F%3E%3Cpath%20d%3D%27M25%2017%20L29%2011%20L35%2011%20L39%2017%20L32%2027%20Z%27%20fill%3D%27%23D4A5A5%27%2F%3E%3Cpath%20d%3D%27M5%2047%20C%2015%2040%2C%2022%2054%2C%2032%2049%20S%2049%2040%2C%2059%2046%27%20fill%3D%27none%27%20stroke%3D%27%23D4A5A5%27%20stroke-width%3D%273%27%20stroke-linecap%3D%27round%27%2F%3E%3C%2Fsvg%3E"
    />
    <!--
      Home screen. An SVG favicon does not cover this: iOS needs a real PNG
      apple-touch-icon, and Android reads the icons out of the web manifest.
      Without both, Chrome invents a tile from the first letter of the title.

      %BASE_URL% is substituted by Vite, so these stay correct whether the app
      is served from the domain root or a project subpath. They must be
      base-absolute rather than relative — a deep link like /app/checklist is
      served the same HTML, and a relative href would resolve against /app/.
    -->
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="AfterIDo" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
