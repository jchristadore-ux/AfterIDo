name: Deploy to Cloudflare

# The production deployment: one Cloudflare Worker serves the built site and
# the /api routes, with a D1 database behind it. This is what makes payments
# possible — GitHub Pages is static, so it can host the app but cannot verify
# a Stripe webhook.
#
# It stays inert until one repository secret exists, so nothing breaks while
# the Cloudflare setup in LAUNCH_GUIDE.md is half-finished:
#
#   CLOUDFLARE_API_TOKEN — the "Edit Cloudflare Workers" template PLUS the
#   Account → D1 → Edit permission. The template alone is not enough: it does
#   not cover D1, so the token authenticates and then the migration step fails
#   with Cloudflare error 7403.
#
# The account id is not a secret (it appears in every dashboard URL) and lives
# in wrangler.jsonc.
#
# THIS IS THE ONLY THING THAT SHOULD DEPLOY THE WORKER. Cloudflare offers a
# second, dashboard-side deployer -- Workers Builds -- that watches the repo and
# deploys on push all by itself. Do not connect it. It knows nothing about the
# migration step below, so it can put code live against a database that has not
# been migrated yet; and with both connected, two deploys race for the same
# Worker on every push. It was connected here once and posted an instant,
# logless red X on every pull request until it was removed. If one comes back,
# disconnect it at Workers & Pages -> afterido -> Settings -> Build rather than
# trying to make it pass.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for the Cloudflare token
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN is not set yet — skipping deploy. See LAUNCH_GUIDE.md."
          fi

      # Catches the two configuration mistakes that otherwise surface as an
      # opaque Cloudflare API error several minutes into a deploy, or — worse
      # — as a Buy button that fails only when a real customer presses it.
      - name: Check the configuration
        if: steps.creds.outputs.ready == 'true'
        run: |
          fail=0

          if grep -q 'REPLACE_WITH_YOUR_D1_DATABASE_ID' wrangler.jsonc; then
            echo "::error::database_id in wrangler.jsonc is still the placeholder."
            echo "::error::Create a D1 database at https://dash.cloudflare.com/ff4b01fbc362a9e794842a52c0ce2996/workers/d1, then paste its Database ID into wrangler.jsonc. The name is yours to choose — set database_name to match; the deploy uses the DB binding, not the name."
            fail=1
          fi

          # A Stripe Product id (prod_) is not a Price id (price_). Checkout
          # needs the Price. This one is a warning, not an error: the app
          # detects it too and keeps Premium switched off rather than showing
          # a button that cannot work, so the rest of the site still deploys.
          if grep -qE '"STRIPE_PRICE_ID"\s*:\s*"prod_' wrangler.jsonc; then
            echo "::warning::STRIPE_PRICE_ID looks like a Stripe *Product* id (prod_...). Checkout needs the *Price* id (price_...), found on the product's page under Pricing. Premium stays switched off until this is corrected."
          fi

          exit $fail

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.creds.outputs.ready == 'true'
        run: npm ci

      # No VITE_BASE: the Worker serves the app from the domain root.
      # VITE_SITE_ORIGIN only affects the generated sitemap, which needs
      # absolute URLs.
      - name: Build
        if: steps.creds.outputs.ready == 'true'
        env:
          VITE_SITE_ORIGIN: https://after-i-do.com
        run: npm run build

      # Runs before the deploy, so the schema is never behind the code that
      # queries it. Migrations are additive and re-running one is a no-op.
      #
      # `DB` is the *binding*, not the database name. wrangler accepts either,
      # and the binding is the one that cannot drift: the database can be
      # renamed in the Cloudflare dashboard, but the binding is what the
      # Worker's code refers to, so it only ever changes alongside the code.
      # Hardcoding the name here is what broke the first deploy after the
      # database was created as "after-i-do" rather than "afterido".
      # `whoami` proves the token authenticates. It does not prove the token may
      # touch D1, and those are separate permissions: Cloudflare's "Edit
      # Cloudflare Workers" template — the one this repo told you to use —
      # grants Workers but not D1.
      #
      # A token built from that template alone passes `whoami` and then fails
      # the very next step with:
      #
      #   The given account is not valid or is not authorized to access this
      #   service [code: 7403]
      #
      # which names neither D1 nor the missing permission, and reads like the
      # account is broken. So the gate asks about D1 directly, and says what to
      # change when the answer is no.
      - name: Verify Cloudflare access
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@4 whoami

          if ! d1_out=$(npx --yes wrangler@4 d1 list 2>&1); then
            echo "$d1_out"
            echo "::error::The token authenticates, but is not authorised for D1 on this account."
            echo "::error::Fix: https://dash.cloudflare.com/profile/api-tokens → edit CLOUDFLARE_API_TOKEN → add permission 'Account' + 'D1' + 'Edit', save, then re-run this workflow. The 'Edit Cloudflare Workers' template does not include D1."
            echo "::error::If the token was created under a different Cloudflare account, recreate it under the account that owns the D1 database in wrangler.jsonc."
            exit 1
          fi

      - name: Apply database migrations
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 d1 migrations apply DB --remote

      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy
