name: Deploy to Cloudflare

# The production deployment: one Cloudflare Worker serves the built site and
# the /api routes, with a D1 database behind it. This is what makes payments
# possible — GitHub Pages is static, so it can host the app but cannot verify
# a Stripe webhook.
#
# It stays inert until one repository secret exists, so nothing breaks while
# the Cloudflare setup in LAUNCH_GUIDE.md is half-finished:
#
#   CLOUDFLARE_API_TOKEN — a token with the "Edit Cloudflare Workers" template
#
# The account id is not a secret (it appears in every dashboard URL) and lives
# in wrangler.jsonc.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for the Cloudflare token
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN is not set yet — skipping deploy. See LAUNCH_GUIDE.md."
          fi

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.creds.outputs.ready == 'true'
        run: npm ci

      # No VITE_BASE: the Worker serves the app from the domain root.
      # VITE_SITE_ORIGIN only affects the generated sitemap, which needs
      # absolute URLs.
      - name: Build
        if: steps.creds.outputs.ready == 'true'
        env:
          VITE_SITE_ORIGIN: https://after-i-do.com
        run: npm run build

      # Runs before the deploy, so the schema is never behind the code that
      # queries it. Migrations are additive and re-running one is a no-op.
      - name: Apply database migrations
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 d1 migrations apply afterido --remote

      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy
