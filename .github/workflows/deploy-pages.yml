name: Deploy to GitHub Pages

# Builds the app and publishes it to GitHub Pages so there is always a live URL
# to click. Runs on every push to main, and can be triggered by hand from the
# Actions tab.
#
# ONE-TIME SETUP: in the repository, go to Settings → Pages and set
# "Build and deployment → Source" to "GitHub Actions". Until that is done this
# workflow builds fine but the deploy step has nowhere to publish.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Let the deployment write to Pages, and read the repo to check it out.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue rather than cancel so a finished build
# always lands.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # A project site is served from /<repo>/, so the bundle and the router
        # both need that prefix.
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Add SPA fallback
        # Pages has no rewrite rules: a deep link like /NameDay/app/checklist is
        # an unknown path. Serving index.html as 404.html lets the SPA boot and
        # route from the real URL instead of showing a Pages 404.
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
